# ABOUTME: Role fixtures for the agents-no-cluster-roles policy tests.
# ABOUTME: One Role that must be denied for wildcard verbs, one that must pass.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-wildcard-verbs
  namespace: agent-claude-prod
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-wildcard-resources
  namespace: agent-claude-prod
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-explicit-scope
  namespace: agent-claude-prod
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
