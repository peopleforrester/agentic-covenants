# ABOUTME: Kyverno CLI test declaring what the authorization policy must admit and deny.
# ABOUTME: Runs without a cluster: kyverno test tests/kyverno/
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: agents-no-cluster-roles
policies:
- ../../controls/authorization/server-side/kyverno-no-cluster-roles.yaml
- ../../controls/content-integrity/server-side/egress-audit-policy.yaml
- ../../examples/kubernetes-cluster/kyverno-multi-agent.yaml
resources:
- resources/roles.yaml
- resources/clusterrolebindings.yaml
- resources/agent-pods.yaml
- resources/multi-agent.yaml
results:

# --- must be DENIED ---

- policy: agents-no-cluster-roles
  rule: deny-wildcard-verbs-in-roles
  resources: [agent-wildcard-verbs]
  kind: Role
  result: fail

- policy: agents-no-cluster-roles
  rule: deny-wildcard-resources-in-roles
  resources: [agent-wildcard-resources]
  kind: Role
  result: fail

- policy: agents-no-cluster-roles
  rule: deny-clusterrolebinding-for-agent-sa
  resources: [agent-cluster-admin]
  kind: ClusterRoleBinding
  result: fail

# --- must be ADMITTED ---
# A policy that denies everything is not a control, it is an outage. The pass
# cases are what prove the policy discriminates rather than blocks.

- policy: agents-no-cluster-roles
  rule: deny-wildcard-verbs-in-roles
  resources: [agent-explicit-scope]
  kind: Role
  result: pass

- policy: agents-no-cluster-roles
  rule: deny-wildcard-resources-in-roles
  resources: [agent-explicit-scope]
  kind: Role
  result: pass

- policy: agents-no-cluster-roles
  rule: deny-clusterrolebinding-for-agent-sa
  resources: [platform-controller]
  kind: ClusterRoleBinding
  result: pass

# --- content integrity: egress audit evidence ---

- policy: agents-require-egress-audit
  rule: require-egress-audit-annotation
  resources: [agent-no-audit-sink]
  kind: Pod
  result: fail

- policy: agents-require-egress-audit
  rule: require-egress-audit-annotation
  resources: [agent-audited]
  kind: Pod
  result: pass

# --- multi-agent isolation: only meaningful once N > 1 ---

- policy: agents-multi-tenant-isolation
  rule: deny-cross-namespace-agent-binding
  resources: [cross-tenant-binding]
  kind: RoleBinding
  result: fail

- policy: agents-multi-tenant-isolation
  rule: deny-cross-namespace-agent-binding
  resources: [same-namespace-binding]
  kind: RoleBinding
  result: pass

- policy: agents-multi-tenant-isolation
  rule: require-distinct-serviceaccount
  resources: [agent-on-default-sa]
  kind: Pod
  result: fail

- policy: agents-multi-tenant-isolation
  rule: require-distinct-serviceaccount
  resources: [agent-compliant]
  kind: Pod
  result: pass

- policy: agents-multi-tenant-isolation
  rule: require-agent-component-label
  resources: [agent-missing-label]
  kind: Pod
  result: fail

- policy: agents-multi-tenant-isolation
  rule: require-agent-component-label
  resources: [agent-compliant]
  kind: Pod
  result: pass
