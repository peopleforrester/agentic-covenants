# ABOUTME: Machine-checkable definition of the Charter blast-radius / agent cell.
# ABOUTME: The audit prompts in this cell's README, expressed so a validator can score them.

cell:
  id: blast-radius.in-agent
  concern: blast-radius
  layer: in-agent
  authority: agent
  document: agent-charter
  owner: "Named human owner. Counter-signed by domain authority and, at Tier 3 and above, security review."
  question: "Does the agent charter declare a specific risk tier, a quantitative damage cap, and the conditions that trigger automatic tier downgrade or retirement?"

mappings:
  csf: "GV.RM-02, ID.RA-05"
  ai_rmf: "GOVERN 1.3, MAP 5.1"
  iso42001: "A.5"
  eu_ai_act: "Art. 9"

checks:
  - id: GV-BR-A-01
    description: "A risk tier from 1 to 4 is declared."
    type: enum
    target: "risk_tier:1,2,3,4"
    document: agent-charter
    severity: blocking
    evidence: "An integer tier."
  - id: GV-BR-A-02
    description: "At least one quantitative damage cap is set."
    type: min_items
    target: "damage_cap:1"
    document: agent-charter
    severity: blocking
    evidence: "A number with a unit."
  - id: GV-BR-A-03
    description: "Forbidden operations are enumerated."
    type: min_items
    target: "damage_cap.forbidden_operations:1"
    document: agent-charter
    severity: blocking
    evidence: "Named operations."
  - id: GV-BR-A-04
    description: "Retirement criteria are concrete enough to be evaluated without judgement."
    type: min_items
    target: "retirement_criteria:2"
    document: agent-charter
    severity: blocking
    evidence: "'When no longer needed' does not count; look for a threshold or a duration."
