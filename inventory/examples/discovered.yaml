    current_state: {status: running, instance_count: 1}

  - agent_identifier: agent-drifted-indexer-001
    identity_runtime: {k8s_serviceaccount: agents/indexer}
    blast_radius_profile: {environments: [dev]}
    current_state: {status: running, instance_count: 1}
