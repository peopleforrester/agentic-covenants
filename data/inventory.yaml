# ABOUTME: Machine-readable source-of-truth for the Agentic Inventory Matrix (Identify framework).
# ABOUTME: Sibling to charter.yaml. Layers are self-declared / operator-declared / discovered. The truth is the cross-reference.
schema_version: 1
title: Agentic Inventory Matrix
question: "What agents exist, what they touch, what threats they face?"
companions: [matrix.yaml, sentinels.yaml, interventions.yaml, restorations.yaml, charter.yaml]

layers:
  - id: in-agent
    label: Self-declared
    strength: advisory
    summary: The agent reports itself. It can be wrong, stale, or absent entirely.
  - id: client-side
    label: Operator-declared
    strength: deterministic-when-invoked
    summary: The operator registered it. Accurate only as far as the operator knows.
  - id: server-side
    label: Discovered
    strength: deterministic-and-external
    summary: Found independently by scanning the target. Trusts neither of the above.

concerns:
  - id: identity
    label: Identity
    intent: Which agents exist, with what credentials, mapped to which charter, owned by which named human.
  - id: authorization
    label: Authorization
    intent: What scope each agent has. What RBAC roles or IAM principals it uses. What could it touch.
  - id: blast-radius
    label: Blast radius
    intent: Worst-case damage if compromised. Environments. Data classes. Revenue or customer impact.
  - id: approval-gating
    label: Approval gating
    intent: Who approved, when last reviewed, when next review due, when retirement fires.
  - id: supply-chain
    label: Supply chain
    intent: Foundation model, MCP servers, base images, tool versions, dependency tree.

principles:
  - id: cross-layer-mismatch-is-a-signal
    summary: Discovered-but-not-operator-declared is a shadow agent. Operator-declared-but-not-discovered is a ghost agent. Mismatches across layers are themselves Sentinels-level alerts.
  - id: stale-inventory-worse-than-none
    summary: A spreadsheet from 9 months ago gives false confidence. Inventory must be live or it is misleading.
  - id: discovery-needs-tooling-not-policy
    summary: Shadow agents are the breach vector in the Cline/postmark-mcp/ClawHavoc class of incidents. The fix is not policy; the fix is discovery tooling.

cells:

  # ---- IDENTITY ----
  - concern: identity
    layer: in-agent
    summary: Agent registers on startup with name, charter ref, owner email, instance ID. Heartbeats. Deregister on shutdown. Dead-mans-switch alerts on heartbeat lapse.
    inventory_path: inventory/identity/in-agent/
    citations:
      nist_csf_2_0: ["ID.AM-01", "ID.AM-02"]
      nist_ai_rmf: ["MAP 1.1", "MAP 4.1"]
      csa_maestro: ["Layer 7"]
      other: ["NIST NCCoE Concept Paper on AI Agent Identity (Feb 5, 2026)"]
    primary_failure_modes:
      - agent never implements registration protocol
      - registers once, never heartbeats
      - registration silently drops on network failure

  - concern: identity
    layer: client-side
    summary: Operator-maintained registry; agents.yaml in GitOps; ServiceNow CMDB; internal AI inventory tool. Owner-confirmed. Updated on charter signature.
    inventory_path: inventory/identity/client-side/
    citations:
      nist_csf_2_0: ["ID.AM-01", "ID.AM-02", "ID.AM-08"]
      nist_ai_rmf: ["MAP 1.1", "MAP 1.5"]
      csa_maestro: ["Layer 7"]
      other: ["ISO/IEC 42001 §A.5", "Singapore IMDA Agentic AI Framework"]
    primary_failure_modes:
      - spreadsheet drift (entries stale within months)
      - registry not GitOps; changes not PR-reviewed

  - concern: identity
    layer: server-side
    summary: CloudTrail / GCP Audit Logs of SA and IAM principal usage. K8s controller watching SA+RoleBinding by naming pattern. Reverse-lookup from credential fingerprints in Sentinels.
    inventory_path: inventory/identity/server-side/
    citations:
      nist_csf_2_0: ["ID.AM-01", "ID.AM-02"]
      nist_ai_rmf: ["MAP 1.1", "MAP 1.5"]
      csa_maestro: ["Layer 4", "Layer 7"]
      other: ["NIST SP 800-92 (log management)", "NIST AI Agent Standards Initiative under CAISI (Feb 17, 2026)"]
    primary_failure_modes:
      - audit logs have gaps (retention expired, delivery failed, audit policy missing the resource)
      - shadow agents in accounts/clusters where discovery has no credentials

  # ---- AUTHORIZATION ----
  - concern: authorization
    layer: in-agent
    summary: Agent reports allowed-tools list, MCP allowlist hashes, effective scope on registration. Updates on scope change.
    inventory_path: inventory/authorization/in-agent/
    citations:
      nist_csf_2_0: ["ID.AM-02"]
      nist_ai_rmf: ["MAP 4.1"]
      csa_maestro: ["Layer 7"]

  - concern: authorization
    layer: client-side
    summary: Operator records authorized scope in registry, linked to RBAC manifest paths and IAM policy ARNs.
    inventory_path: inventory/authorization/client-side/
    citations:
      nist_csf_2_0: ["ID.AM-02", "ID.AM-08"]
      nist_ai_rmf: ["MAP 1.5", "MAP 4.1"]
      csa_maestro: ["Layer 7"]

  - concern: authorization
    layer: server-side
    summary: K8s RBAC API list, AWS IAM Access Analyzer effective permissions, Kyverno PolicyReports of policies actually applied.
    inventory_path: inventory/authorization/server-side/
    citations:
      nist_csf_2_0: ["ID.RA-09", "ID.RA-01"]
      nist_ai_rmf: ["MAP 5.1"]
      csa_maestro: ["Layer 4", "Layer 6"]
      other: ["NIST SP 800-207"]

  # ---- BLAST RADIUS ----
  - concern: blast-radius
    layer: in-agent
    summary: Agent reports declared risk tier, damage cap, forbidden operations from its charter. Reports current environment and data class access.
    inventory_path: inventory/blast-radius/in-agent/
    citations:
      nist_csf_2_0: ["ID.RA-01"]
      nist_ai_rmf: ["MAP 5.1", "MAP 5.2"]

  - concern: blast-radius
    layer: client-side
    summary: Operator records blast-radius profile per agent. Worst-case impact statement (revenue, customer, compliance).
    inventory_path: inventory/blast-radius/client-side/
    citations:
      nist_csf_2_0: ["ID.RA-01", "ID.RA-04"]
      nist_ai_rmf: ["MAP 5.1", "MAP 5.2"]
      csa_maestro: ["Layer 4", "Layer 6"]
      other: ["NIST AI 600-1 (GAI risks taxonomy)", "EU AI Act Art. 9(2)"]

  - concern: blast-radius
    layer: server-side
    summary: Threat-modeling output (MAESTRO Layer 7, MITRE ATLAS, lateral-movement path analysis). Behavioral observation of what the agent has touched.
    inventory_path: inventory/blast-radius/server-side/
    citations:
      nist_csf_2_0: ["ID.RA-01", "ID.RA-04", "ID.AM-05"]
      nist_ai_rmf: ["MAP 5.1", "MAP 5.2", "MAP 3.1"]
      csa_maestro: ["Layer 4", "Layer 7"]
      other: ["MITRE ATLAS", "CSA Agentic AI Red Teaming Guide"]

  # ---- APPROVAL GATING ----
  - concern: approval-gating
    layer: in-agent
    summary: Agent reports last charter signature date, next review due, current charter version on registration. Refuses to start if charter is expired.
    inventory_path: inventory/approval-gating/in-agent/
    citations:
      nist_csf_2_0: ["ID.IM-01"]
      nist_ai_rmf: ["GOVERN 1.5", "MAP 4.1"]

  - concern: approval-gating
    layer: client-side
    summary: Operator-maintained review calendar. Quarterly attestation. Tracks pending and overdue reviews.
    inventory_path: inventory/approval-gating/client-side/
    citations:
      nist_csf_2_0: ["ID.IM-01", "ID.IM-02"]
      nist_ai_rmf: ["GOVERN 1.5"]
      other: ["ISO/IEC 42001 §A.9 (performance evaluation)"]

  - concern: approval-gating
    layer: server-side
    summary: Registry of charter files in source control. Last-modified, last-PR-merged. Cross-reference with self-declared and operator-declared.
    inventory_path: inventory/approval-gating/server-side/
    citations:
      nist_csf_2_0: ["ID.IM-01", "ID.IM-03"]
      nist_ai_rmf: ["GOVERN 1.5", "MANAGE 4.1"]

  # ---- SUPPLY CHAIN ----
  - concern: supply-chain
    layer: in-agent
    summary: "Agent reports current dependency manifest on registration: foundation model + version, MCP server names + hashes, base image SHA, lockfile fingerprint. Updates on change."
    inventory_path: inventory/supply-chain/in-agent/
    citations:
      nist_csf_2_0: ["ID.AM-04", "ID.RA-09"]
      nist_ai_rmf: ["MAP 4.1"]
      csa_maestro: ["Layer 1", "Layer 7"]
      owasp_mcp: ["MCP04", "MCP09"]

  - concern: supply-chain
    layer: client-side
    summary: Operator records authorized-dependency manifest from agent charter. Linked to Covenants L2-C5 and L3-C5 allowlists. Version-controlled audit trail.
    inventory_path: inventory/supply-chain/client-side/
    citations:
      nist_csf_2_0: ["ID.AM-04", "ID.RA-09"]
      nist_ai_rmf: ["MAP 4.1"]
      csa_maestro: ["Layer 1", "Layer 7"]
      other: ["NIST SP 800-218A"]

  - concern: supply-chain
    layer: server-side
    summary: Image-registry pull events, package-manager logs, runtime introspection of loaded models and connected MCP servers, SBOM scanning. Drift between actual and authorized = alert.
    inventory_path: inventory/supply-chain/server-side/
    citations:
      nist_csf_2_0: ["ID.RA-09", "ID.AM-04"]
      nist_ai_rmf: ["MAP 4.1"]
      csa_maestro: ["Layer 1", "Layer 3", "Layer 7"]
      owasp_mcp: ["beta"]
      other: ["NIST SP 800-161 Rev. 1"]
    primary_failure_modes:
      - MCP over unix socket leaves no network trace
      - SBOM scan misses transitive dependency changes
