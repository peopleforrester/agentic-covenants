# ABOUTME: Machine-readable source-of-truth for the Agentic Charter Matrix (Govern framework).
# ABOUTME: Sibling to matrix.yaml/sentinels.yaml/interventions.yaml/restorations.yaml. Cells are policy questions, not runtime artifacts.
schema_version: 1
title: Agentic Charter Matrix
question: "Who is allowed to put this agent into the world, under what authority, accountable to what policy, with what retirement criteria?"
companions: [matrix.yaml, sentinels.yaml, interventions.yaml, restorations.yaml]

layers:
  - id: organizational
    label: Organizational charter
    summary: Top-of-house policy. AI Acceptable Use Policy, AI Risk Appetite Statement, regulatory commitments. Applies to every agent the org operates.
    owner: AI Governance Council / Board
  - id: domain
    label: Domain charter
    summary: Per-domain governance. DevOps agents, customer-facing agents, internal automation, research agents.
    owner: Domain leadership (Platform Engineering Director, Security Director, etc.)
  - id: agent
    label: Agent charter
    summary: The specific authorization document for a single agent. Names owner, risk tier, scope, dependencies, approval signatures, retirement criteria.
    owner: Named operator, signed by domain authority

concerns:
  - id: identity
    label: Identity
    intent: Who can authorize creation? Who is the named human owner accountable for this agent's actions?
  - id: authorization
    label: Authorization
    intent: What scope does the charter grant? Under what change-control process can scope be expanded?
  - id: blast-radius
    label: Blast radius
    intent: What risk tier? What damage cap is acceptable? Under what conditions does the charter permit production access?
  - id: approval-gating
    label: Approval gating
    intent: Who must approve the charter itself? Who approves changes to it? Who approves retirement?
  - id: supply-chain
    label: Supply chain
    intent: What models, MCP servers, dependencies, base images is the charter allowed to use? Under what change-control?

principles:
  - id: governance-not-optional
    summary: Without Charter, every other matrix is reactive. The agent already exists; you are figuring out how to govern it after the fact.
  - id: charter-feeds-operational
    summary: The Charter constraints are what Covenants enforces, what Sentinels watches for, what Interventions stops on, and what Restorations rebuilds toward. If Charter is missing, the operational matrices have no anchor.
  - id: signed-and-dated
    summary: A cell is populated only when the policy is written, named owners exist, the document is signed and dated. "We know this but it is not written" is the empty state.
  - id: retirement-is-real
    summary: Charters with vague retirement criteria leave agents to accumulate. Six months in, half the inventory is unowned. Retirement criteria must be quantitative or condition-based.

cells:

  # ---- IDENTITY ----
  - concern: identity
    layer: organizational
    summary: AI Acceptable Use Policy names categories of agents allowed to exist. AI Governance Council holds authority to create new agent classes. Director of AI Workforce Transformation is the named org-wide owner.
    charter_path: charter/identity/organizational/
    citations:
      nist_csf_2_0: ["GV.OC-01", "GV.OC-02", "GV.PO-01", "GV.PO-02"]
      nist_ai_rmf: ["GOVERN 1.1", "GOVERN 1.4"]
      iso_iec_42001: ["§A.2", "§A.3"]
      eu_ai_act: ["Art. 9", "Art. 17"]

  - concern: identity
    layer: domain
    summary: Domain leadership signs charter authorizing a class of agents. Names roles permitted to create agents and the escalation path.
    charter_path: charter/identity/domain/
    citations:
      nist_csf_2_0: ["GV.RR-02", "GV.OV-01"]
      nist_ai_rmf: ["GOVERN 2.1", "GOVERN 5.1"]
      iso_iec_42001: ["§A.6.2"]
      eu_ai_act: ["Art. 26"]

  - concern: identity
    layer: agent
    summary: Named human owner accountable for the agent's actions. Backup owner identified. Identity claims tied to charter via registered agent identifier.
    charter_path: charter/identity/agent/
    citations:
      nist_csf_2_0: ["GV.RR-02", "PR.AA-01"]
      nist_ai_rmf: ["GOVERN 2.1", "GOVERN 2.2"]
      iso_iec_42001: ["§A.4.1"]
      eu_ai_act: ["Art. 14(4)", "Art. 26"]
      other: ["NIST NCCoE Concept Paper on AI Agent Identity (Feb 5, 2026)"]

  # ---- AUTHORIZATION ----
  - concern: authorization
    layer: organizational
    summary: AI Risk Appetite Statement defines hard prohibitions and change-control process for evolving scope policy.
    charter_path: charter/authorization/organizational/
    citations:
      nist_csf_2_0: ["GV.RM-01", "GV.RM-02", "GV.PO-01"]
      nist_ai_rmf: ["GOVERN 1.2", "GOVERN 1.5"]
      iso_iec_42001: ["§A.6.1"]
      eu_ai_act: ["Art. 9(2)"]

  - concern: authorization
    layer: domain
    summary: Per-class scope, inherits org hard prohibitions, adds domain-specific restrictions.
    charter_path: charter/authorization/domain/
    citations:
      nist_csf_2_0: ["GV.PO-01", "PR.AA-05"]
      nist_ai_rmf: ["GOVERN 1.4", "MANAGE 2.4"]
      iso_iec_42001: ["§A.6.2"]
      eu_ai_act: ["Art. 14", "Art. 15"]

  - concern: authorization
    layer: agent
    summary: Specific authorized scope. Named tools, MCP servers, environments, max-blast-radius. Scope expansion requires re-signature.
    charter_path: charter/authorization/agent/
    citations:
      nist_csf_2_0: ["GV.PO-01", "PR.AA-05"]
      nist_ai_rmf: ["GOVERN 1.4", "MANAGE 2.4"]
      iso_iec_42001: ["§A.6.2"]
      eu_ai_act: ["Art. 14", "Art. 15"]

  # ---- BLAST RADIUS ----
  - concern: blast-radius
    layer: organizational
    summary: Org-wide risk tier taxonomy (1 read-only, 2 scoped writes, 3 destructive, 4 production-critical) with damage caps and matching control requirements.
    charter_path: charter/blast-radius/organizational/
    citations:
      nist_csf_2_0: ["GV.RM-01", "GV.RM-02"]
      nist_ai_rmf: ["GOVERN 1.3", "MAP 5.1"]
      iso_iec_42001: ["§A.6"]
      eu_ai_act: ["Art. 9(3)", "Art. 9(4)"]

  - concern: blast-radius
    layer: domain
    summary: Inherits tier taxonomy, defines which tiers the domain is authorized to operate, defines failure-mode reviews per tier.
    charter_path: charter/blast-radius/domain/
    citations:
      nist_csf_2_0: ["GV.RM-03", "GV.RM-04"]
      nist_ai_rmf: ["GOVERN 1.3"]
      iso_iec_42001: ["§A.6"]

  - concern: blast-radius
    layer: agent
    summary: Specific risk tier, specific damage cap (records-per-session, USD-per-day, forbidden ops), conditions for tier downgrade or retirement.
    charter_path: charter/blast-radius/agent/
    citations:
      nist_csf_2_0: ["GV.RM-01", "GV.RM-02"]
      nist_ai_rmf: ["GOVERN 1.3", "MAP 5.1", "MAP 5.2"]
      iso_iec_42001: ["§A.6"]
      eu_ai_act: ["Art. 9(2)(a)", "Art. 9(2)(b)", "Art. 9(2)(c)", "Art. 9(2)(d)"]

  # ---- APPROVAL GATING ----
  - concern: approval-gating
    layer: organizational
    summary: AI Governance Council approves new agent classes, ratifies risk-tier policy. Member roles named (CISO, Chief AI Officer, GC, Privacy, Domain Leads). Quorum and voting rules defined.
    charter_path: charter/approval-gating/organizational/
    citations:
      nist_csf_2_0: ["GV.RR-01", "GV.RR-02", "GV.RR-03"]
      nist_ai_rmf: ["GOVERN 2.1", "GOVERN 2.2"]
      iso_iec_42001: ["§A.4", "§A.5"]
      eu_ai_act: ["Art. 17(1)(b)", "Art. 26"]

  - concern: approval-gating
    layer: domain
    summary: Domain authority approves charters within its domain. Multi-party signature for Tier 3+. Charter amendments require the same process as originals.
    charter_path: charter/approval-gating/domain/
    citations:
      nist_csf_2_0: ["GV.RR-02", "GV.OV-02"]
      nist_ai_rmf: ["GOVERN 4.1"]
      iso_iec_42001: ["§A.4.2"]
      eu_ai_act: ["Art. 17(1)(c)"]

  - concern: approval-gating
    layer: agent
    summary: Charter signed by owner, domain authority, and (Tier 3+) security review. Charter identifies approver of every subsequent scope change. Annual review cadence. Emergency revocation conditions specified.
    charter_path: charter/approval-gating/agent/
    citations:
      nist_csf_2_0: ["GV.RR-02", "GV.OV-02", "GV.OV-03"]
      nist_ai_rmf: ["GOVERN 4.1", "MANAGE 4.1"]
      iso_iec_42001: ["§A.4.2", "§A.9"]
      eu_ai_act: ["Art. 14", "Art. 26"]

  # ---- SUPPLY CHAIN ----
  - concern: supply-chain
    layer: organizational
    summary: Org-wide allowlist of approved foundation models. Org-wide policy on MCP server approval, third-party dependency approval, vendor risk assessment integrated with procurement.
    charter_path: charter/supply-chain/organizational/
    citations:
      nist_csf_2_0: ["GV.SC-01", "GV.SC-02", "GV.SC-03", "GV.SC-04", "GV.SC-05", "GV.SC-06", "GV.SC-07", "GV.SC-08", "GV.SC-09", "GV.SC-10", "ID.RA-09"]
      nist_ai_rmf: ["GOVERN 6.1", "GOVERN 6.2", "MAP 4.1"]
      iso_iec_42001: ["§A.10"]
      eu_ai_act: ["Art. 25"]
      other: ["NIST SP 800-161 Rev. 1", "NIST SP 800-218A"]

  - concern: supply-chain
    layer: domain
    summary: Inherits org-wide approved-model list, adds domain-specific restrictions (e.g., "no models that train on user data", "SOC 2 Type II vendors only"). Approves or denies MCP servers for the domain.
    charter_path: charter/supply-chain/domain/
    citations:
      nist_csf_2_0: ["GV.SC-04", "GV.SC-07"]
      nist_ai_rmf: ["GOVERN 6.1", "MAP 4.1"]
      iso_iec_42001: ["§A.10"]
      eu_ai_act: ["Art. 25"]

  - concern: supply-chain
    layer: agent
    summary: Specific dependencies declared. Named foundation model and version, named MCP servers (with hashes from Covenants L2-C5), named base images, named tool versions. Dependency changes require charter amendment.
    charter_path: charter/supply-chain/agent/
    citations:
      nist_csf_2_0: ["GV.SC-07", "ID.RA-09"]
      nist_ai_rmf: ["GOVERN 6.2", "MAP 4.1"]
      iso_iec_42001: ["§A.10"]
      eu_ai_act: ["Art. 25"]
      owasp_mcp: ["MCP04", "MCP09"]
