M 551.0 413.0 L 562.0 422.0 L 551.0 431.0 Z" fill="#78879c"/><rect x="566.0" y="236.0" width="225.0" height="372.0" rx="14" fill="#f4f7fb" stroke="#d3dde9" stroke-width="1.5"/><rect x="566.0" y="236" width="225.0" height="6" rx="3" fill="#22815a"/><text x="678.5" y="284.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21.0" font-weight="700" fill="#22815a" text-anchor="middle" letter-spacing="0" opacity="1">PR</text><text x="678.5" y="328.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25.0" font-weight="700" fill="#111820" text-anchor="middle" letter-spacing="0" opacity="1">Covenants</text><text x="678.5" y="356.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.0" font-weight="400" fill="#78879c" text-anchor="middle" letter-spacing="0" opacity="1">Protect</text><text x="678.5" y="396.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20.0" font-weight="600" fill="#4d5b6e" text-anchor="middle" letter-spacing="0" opacity="1">binds</text><text x="678.5" y="442.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.0" font-weight="400" fill="#78879c" text-anchor="middle" letter-spacing="0" opacity="1">What stops it</text><text x="678.5" y="465.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.0" font-weight="400" fill="#78879c" text-anchor="middle" letter-spacing="0" opacity="1">from violating?</text><line x1="588.0" y1="498" x2="769.0" y2="498" stroke="#d3dde9" stroke-width="1"/><rect x="590.0" y="516" width="9" height="9" rx="2" fill="#c26320"/><text x="608.0" y="525.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" font-weight="400" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">in-agent</text><rect x="590.0" y="538" width="9" h