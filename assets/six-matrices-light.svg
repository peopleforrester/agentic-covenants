<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Six matrices mapped to the six NIST CSF 2.0 functions</title>
<desc id="d">Charter authorizes, Inventory tracks, Covenants binds, Sentinels watches, Interventions stops, Restorations rebuilds. Recovery feeds back into prevention.</desc>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="80.0" y="92.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="50.0" font-weight="700" fill="#111820" text-anchor="start" letter-spacing="-1" opacity="1">Six matrices,</text><text x="80.0" y="148.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="50.0" font-weight="700" fill="#4d5b6e" text-anchor="start" letter-spacing="-1" opacity="1">one per NIST CSF 2.0 function</text><text x="1520.0" y="100.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="34.0" font-weight="700" fill="#2f5fd0" text-anchor="end" letter-spacing="0" opacity="1">93 cells</text><text x="1520.0" y="136.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="400" fill="#78879c" text-anchor="end" letter-spacing="0" opacity="1">5 or 6 concerns × 3 layers, each</text><rect x="80.0" y="236.0" width="225.0" height="372.0" rx="14" fill="#f4f7fb" stroke="#d3dde9" stroke-width="1.5"/><rect x="80.0" y="236" width="225.0" height="6" rx="3" fill="#8b7ce8"/><text x="192.5" y="284.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21.0" font-weight="700" fill="#8b7ce8" text-anchor="middle" letter-spacing="0" opacity="1">GV</text><text x="192.5" y="328.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25.0" font-weight="700" fill="#111820" text-anchor="middle" letter-spacing="0" opacity="1">Charter</text><text x="192.5" y="356.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.0" font-weight="400" fill="#78879c" text-anchor="middle" letter-spacing="0" opacity="1">Govern</text><text x="192.5" y="396.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20.0" font-weight="600" fill="#4d5b6e" text-anchor="middle" letter-spacing="0" opacity="1">authorizes</text><text x="192.5" y="442.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.0" font-weight="400" fill="#78879c" text-anchor="middle" letter-spacing="0" opacity="1">Who allowed this</text><text x="192.5" y="465.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.0" font-weight="400" fill="#78879c" text-anchor="middle" letter-spacing="0" opacity="1">agent to exist?</text><line x1="102.0" y1="498" x2="283.0" y2="498" stroke="#d3dde9" stroke-width="1"/><rect x="104.0" y="516" width="9" height="9" rx="2" fill="#c26320"/><text x="122.0" y="525.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" font-weight="400" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">in-agent</text><rect x="104.0" y="538" width="9" height="9" rx="2" fill="#1f6fa8"/><text x="122.0" y="547.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" font-weight="400" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">client</text><rect x="104.0" y="560" width="9" height="9" rx="2" fill="#22815a"/><text x="122.0" y="569.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" font-weight="400" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">server</text><path d="M 308.0 413.0 L 319.0 422.0 L 308.0 431.0 Z" fill="#78879c"/><rect x="323.0" y="236.0" width="225.0" height="372.0" rx="14" fill="#f4f7fb" stroke="#d3dde9" stroke-width="1.5"/><rect x="323.0" y="236" width="225.0" height="6" rx="3" fill="#2f5fd0"/><text x="435.5" y="284.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21.0" font-weight="700" fill="#2f5fd0" text-anchor="middle" letter-spacing="0" opacity="1">ID</text><text x="435.5" y="328.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size=