vetica,Arial,sans-serif" font-size="15.0" font-weight="400" fill="#78879c" text-anchor="middle" letter-spacing="0" opacity="1">it was breached?</text><line x1="831.0" y1="498" x2="1012.0" y2="498" stroke="#d3dde9" stroke-width="1"/><rect x="833.0" y="516" width="9" height="9" rx="2" fill="#c26320"/><text x="851.0" y="525.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" font-weight="400" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">in-agent</text><rect x="833.0" y="538" width="9" height="9" rx="2" fill="#1f6fa8"/><text x="851.0" y="547.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" font-weight="400" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">client</text><rect x="833.0" y="560" width="9" height="9" rx="2" fill="#22815a"/><text x="851.0" y="569.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" font-weight="400" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">server</text><path d="M 1037.0 413.0 L 1048.0 422.0 L 1037.0 431.0 Z" fill="#78879c"/><rect x="1052.0" y="236.0" width="225.0" height="372.0" rx="14" fill="#f4f7fb" stroke="#d3dde9" stroke-width="1.5"/><rect x="1052.0" y="236" width="225.0" height="6" rx="3" fill="#c26320"/><text x="1164.5" y="284.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21.0" font-weight="700" fill="#c26320" text-anchor="middle" letter-spacing="0" opacity="1">RS</text><text x="1164.5" y="328.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25.0" font-weight="700" fill="#111820" text-anchor="middle" letter-spacing="0" opacity="1">Interventions</text><text x="1164.5" y="356.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.0" font-weight="400" fill="#78879c" text-anchor="middle" letter-spacing="0" opacity="1">Respond</text><text x="1164.5" y="396.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20.0" font-weight="600" fill="#4d5b6e" text-anchor="middle" letter-spacing="0" opacity="1">stops</text><text x="1164.5" y="442.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.0" font-weight="400" fill="#78879c" text-anchor="middle" letter-spacing="0" opacity="1">How do I stop</text><text x="1164.5" y="465.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.0" font-weight="400" fill="#78879c" text-anchor="middle" letter-spacing="0" opacity="1">the bleeding now?</text><line x1="1074.0" y1="498" x2="1255.0" y2="498" stroke="#d3dde9" stroke-width="1"/><rect x="1076.0" y="516" width="9" height="9" rx="2" fill="#c26320"/><text x="1094.0" y="525.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" font-weight="400" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">in-agent</text><rect x="1076.0" y="538" width="9" height="9" rx="2" fill="#1f6fa8"/><text x="1094.0" y="547.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" font-weight="400" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">client</text><rect x="1076.0" y="560" width="9" height="9" rx="2" fill="#22815a"/><text x="1094.0" y="569.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.0" font-weight="400" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">server</text><path d="M 1280.0 413.0 L 1291.0 422.0 L 1280.0 431.0 Z" fill="#78879c"/><rect x="1295.0" y="236.0" width="225.0" height="372.0" rx="14" fill="#f4f7fb" stroke="#d3dde9" stroke-width="1.5"/><rect x="1295.0" y="236" width="225.0" height="6" rx="3" fill="#c0392b"/><text x="1407.5" y="284.0" font-family="ui-monospa