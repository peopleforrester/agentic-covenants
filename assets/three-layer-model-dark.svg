<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">The layer you can talk to is the layer that fails</title>
<desc id="d">Three enforcement layers. The in-agent layer is advisory and porous, so an agent's intent passes through it. The client-side and server-side layers are deterministic and hold, because they do not read the conversation.</desc>
<rect width="1600" height="900" fill="#0f1115"/>
<text x="80.0" y="96.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="54.0" font-weight="700" fill="#e9eef5" text-anchor="start" letter-spacing="-1" opacity="1">The layer you can talk to</text><text x="80.0" y="156.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="54.0" font-weight="700" fill="#9dabbd" text-anchor="start" letter-spacing="-1" opacity="1">is the layer that fails.</text><text x="1100.0" y="92.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20.0" font-weight="600" fill="#e05252" text-anchor="middle" letter-spacing="0" opacity="1">agent decides to act</text><path d="M 1100 108 L 1100 196" stroke="#e05252" stroke-width="3" fill="none"/><path d="M 1092 190 L 1100 202 L 1108 190 Z" fill="#e05252"/><rect x="80.0" y="210.0" width="1440.0" height="178.0" rx="14" fill="#181d26" stroke="#2b3444" stroke-width="1.5"/><rect x="80" y="210" width="7" height="178" rx="3.5" fill="#e0803a"/><text x="116.0" y="256.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20.0" font-weight="700" fill="#e0803a" text-anchor="start" letter-spacing="0" opacity="1">L1</text><text x="116.0" y="302.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="33.0" font-weight="700" fill="#e9eef5" text-anchor="start" letter-spacing="1.5" opacity="1">IN-AGENT</text><text x="116.0" y="340.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19.0" font-weight="400" fill="#9dabbd" text-anchor="start" letter-spacing="0" opacity="1">System prompt · tool descriptions · refusals · “are you sure?”</text><text x="116.0" y="368.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="600" fill="#6d7b8e" text-anchor="start" letter-spacing="0" opacity="1">Bypassable by language alone</text><rect x="1252.0" y="240.0" width="232.0" height="40.0" rx="20" fill="none" stroke="#e0803a" stroke-width="2"/><text x="1368.0" y="267.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.0" font-weight="700" fill="#e0803a" text-anchor="middle" letter-spacing="1.2" opacity="1">ADVISORY</text><line x1="1000" y1="358" x2="1484" y2="358" stroke="#e0803a" stroke-width="4" stroke-dasharray="10 14" opacity="0.75"/><text x="1484.0" y="384.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.0" font-weight="400" fill="#6d7b8e" text-anchor="end" letter-spacing="0" opacity="1">porous</text><path d="M 1100 210 L 1100 549" stroke="#e05252" stroke-width="3" fill="none" stroke-dasharray="7 7"/><rect x="80.0" y="414.0" width="1440.0" height="178.0" rx="14" fill="#181d26" stroke="#2b3444" stroke-width="1.5"/><rect x="80" y="414" width="7" height="178" rx="3.5" fill="#3f9ad6"/><text x="116.0" y="460.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20.0" font-weight="700" fill="#3f9ad6" text-anchor="start" letter-spacing="0" opacity="1">L2</text><text x="116.0" y="506.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="33.0" font-weight="700" fill="#e9eef5" text-anchor="start" letter-spacing="1.5" opacity="1">CLIENT-SIDE</text><text x="116.0" y="544.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19.0" font-weight="400" fill="#9dabbd" text-anchor="start" letter-spacing="0" opacity="1">PreToolUse hooks · sandbox at launch · MCP allowlist · filesystem ACLs</text><text x="116.0" y="572.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="600" fill="#6d7b8e" text-anchor="start" letter-spacing="0" opacity="1">Outside the model’s reasoning</text><rect x="1252.0" y="444.0" width="232.0" height="40.0" rx="20" fill="none" stroke="#3f9ad6" stroke-width="2"/><text x="1368.0" y="471.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.0" font-weight="700" fill="#3f9ad6" text-anchor="middle" letter-spacing="1.2" opacity="1">DETERMINISTIC</text><line x1="1000" y1="562" x2="1484" y2="562" stroke="#3f9ad6" stroke-width="7"/><text x="1484.0" y="588.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.0" font-weight="400" fill="#6d7b8e" text-anchor="end" letter-spacing="0" opacity="1">holds</text><text x="1124.0" y="546.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19.0" font-weight="700" fill="#3f9ad6" text-anchor="start" letter-spacing="0" opacity="1">stopped here</text><circle cx="1100" cy="562" r="12" fill="#0f1115" stroke="#3f9ad6" stroke-width="4"/><rect x="80.0" y="618.0" width="1440.0" height="178.0" rx="14" fill="#181d26" stroke="#2b3444" stroke-width="1.5"/><rect x="80" y="618" width="7" height="178" rx="3.5" fill="#43b581"/><text x="116.0" y="664.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20.0" font-weight="700" fill="#43b581" text-anchor="start" letter-spacing="0" opacity="1">L3</text><text x="116.0" y="710.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="33.0" font-weight="700" fill="#e9eef5" text-anchor="start" letter-spacing="1.5" opacity="1">SERVER-SIDE</text><text x="116.0" y="748.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19.0" font-weight="400" fill="#9dabbd" text-anchor="start" letter-spacing="0" opacity="1">RBAC · admission policy · IAM · branch protection · cosign</text><text x="116.0" y="776.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="600" fill="#6d7b8e" text-anchor="start" letter-spacing="0" opacity="1">Outside the agent entirely</text><rect x="1252.0" y="648.0" width="232.0" height="40.0" rx="20" fill="none" stroke="#43b581" stroke-width="2"/><text x="1368.0" y="675.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.0" font-weight="700" fill="#43b581" text-anchor="middle" letter-spacing="1.2" opacity="1">EXTERNAL</text><line x1="1000" y1="766" x2="1484" y2="766" stroke="#43b581" stroke-width="7"/><text x="1484.0" y="792.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.0" font-weight="400" fill="#6d7b8e" text-anchor="end" letter-spacing="0" opacity="1">holds</text><text x="80.0" y="872.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21.0" font-weight="400" fill="#9dabbd" text-anchor="start" letter-spacing="0" opacity="1">Everything an agent can be told is advisory. Constraints that hold live outside the model’s reasoning.</text><text x="1520.0" y="872.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19.0" font-weight="600" fill="#7aa2f7" text-anchor="end" letter-spacing="0" opacity="1">agenticcovenants.com</text></svg>
