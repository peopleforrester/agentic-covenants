<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">One action, three layers</title>
<desc id="d">An agent runs kubectl delete against production. The in-agent layer is talked past and the action runs. The client-side hook blocks it without reading the conversation. Server-side RBAC blocks it on the target.</desc>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="76.0" y="88.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46.0" font-weight="700" fill="#111820" text-anchor="start" letter-spacing="-1" opacity="1">The layer you can talk to is the layer that fails.</text><text x="76.0" y="148.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22.0" font-weight="400" fill="#4d5b6e" text-anchor="start" letter-spacing="0" opacity="1">the agent decides to run</text><rect x="76.0" y="168.0" width="1448.0" height="62.0" rx="10" fill="#f4f7fb" stroke="#c0392b" stroke-width="2"/><text x="104.0" y="208.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="30.0" font-weight="600" fill="#111820" text-anchor="start" letter-spacing="0" opacity="1">$ kubectl delete deployment/payments-api</text><rect x="76.0" y="262.0" width="1448.0" height="176.0" rx="12" fill="#f4f7fb" stroke="#d3dde9" stroke-width="1.5"/><rect x="76" y="262" width="7" height="176" rx="3.5" fill="#c26320"/><text x="112.0" y="304.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21.0" font-weight="700" fill="#c26320" text-anchor="start" letter-spacing="0" opacity="1">L1</text><text x="160.0" y="304.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="27.0" font-weight="700" fill="#111820" text-anchor="start" letter-spacing="1" opacity="1">IN-AGENT</text><text x="112.0" y="346.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22.0" font-weight="400" fill="#4d5b6e" text-anchor="start" letter-spacing="0" opacity="1">System prompt: “never touch production”</text><text x="112.0" y="384.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23.0" font-weight="400" fill="#111820" text-anchor="start" letter-spacing="0" opacity="1">Model agrees, then is told it is staging. It complies.</text><text x="112.0" y="418.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21.0" font-weight="600" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">It read the conversation. That is the vulnerability.</text><text x="1488.0" y="336.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44.0" font-weight="700" fill="#c0392b" text-anchor="end" letter-spacing="1" opacity="1">RUNS</text><text x="1488.0" y="374.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20.0" font-weight="400" fill="#78879c" text-anchor="end" letter-spacing="0" opacity="1">advisory</text><rect x="76.0" y="454.0" width="1448.0" height="176.0" rx="12" fill="#f4f7fb" stroke="#d3dde9" stroke-width="1.5"/><rect x="76" y="454" width="7" height="176" rx="3.5" fill="#1f6fa8"/><text x="112.0" y="496.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21.0" font-weight="700" fill="#1f6fa8" text-anchor="start" letter-spacing="0" opacity="1">L2</text><text x="160.0" y="496.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="27.0" font-weight="700" fill="#111820" text-anchor="start" letter-spacing="1" opacity="1">CLIENT-SIDE</text><text x="112.0" y="538.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22.0" font-weight="400" fill="#4d5b6e" text-anchor="start" letter-spacing="0" opacity="1">PreToolUse hook  ·  deny-protected-paths.sh</text><text x="112.0" y="576.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23.0" font-weight="400" fill="#111820" text-anchor="start" letter-spacing="0" opacity="1">Pattern matches kubectl delete. Hook exits 2.</text><text x="112.0" y="610.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21.0" font-weight="600" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">The hook never saw the conversation.</text><text x="1488.0" y="528.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44.0" font-weight="700" fill="#22815a" text-anchor="end" letter-spacing="1" opacity="1">BLOCKED</text><text x="1488.0" y="566.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20.0" font-weight="400" fill="#78879c" text-anchor="end" letter-spacing="0" opacity="1">deterministic</text><rect x="76.0" y="646.0" width="1448.0" height="176.0" rx="12" fill="#f4f7fb" stroke="#d3dde9" stroke-width="1.5"/><rect x="76" y="646" width="7" height="176" rx="3.5" fill="#22815a"/><text x="112.0" y="688.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21.0" font-weight="700" fill="#22815a" text-anchor="start" letter-spacing="0" opacity="1">L3</text><text x="160.0" y="688.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="27.0" font-weight="700" fill="#111820" text-anchor="start" letter-spacing="1" opacity="1">SERVER-SIDE</text><text x="112.0" y="730.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22.0" font-weight="400" fill="#4d5b6e" text-anchor="start" letter-spacing="0" opacity="1">RBAC Role  ·  verbs: [get, list, watch]</text><text x="112.0" y="768.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23.0" font-weight="400" fill="#111820" text-anchor="start" letter-spacing="0" opacity="1">API server returns 403 Forbidden.</text><text x="112.0" y="802.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21.0" font-weight="600" fill="#78879c" text-anchor="start" letter-spacing="0" opacity="1">Enforced on the target, not on the agent.</text><text x="1488.0" y="720.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44.0" font-weight="700" fill="#22815a" text-anchor="end" letter-spacing="1" opacity="1">BLOCKED</text><text x="1488.0" y="758.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20.0" font-weight="400" fill="#78879c" text-anchor="end" letter-spacing="0" opacity="1">external</text><text x="76.0" y="862.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22.0" font-weight="400" fill="#4d5b6e" text-anchor="start" letter-spacing="0" opacity="1">One action · one concern of six · one of three layers. The full matrix is 93 cells, each with a working artifact.</text><text x="1524.0" y="862.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21.0" font-weight="700" fill="#2f5fd0" text-anchor="end" letter-spacing="0" opacity="1">agenticcovenants.com</text></svg>
